[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "research-hub"
version = "0.1.0"
description = "Local web control surface for structured multi-agent research workflows"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.0",
    "Werkzeug>=3.0",
    "Markdown>=3.5",
    "PyYAML>=6.0",
    "ruamel.yaml>=0.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
research-hub = "webapp:main"

[tool.setuptools]
packages = ["core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
