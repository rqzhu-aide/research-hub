# Research Hub Configuration
# User maps one Hermes profile to each research role here.

hub:
  name: "My Research Hub"
  workspace_dir: "~/research"    # where projects + database live (separate from app)
  # projects:    ~/research/projects/project-NNN-<slug>/
  # database:    ~/research/hub.db
  run_timeout_minutes: 240   # numerical phases run real MCMC; 120m was too short
# Phase runs are explicitly started by the user. This permits the lead to
# execute the project-local tools needed by Hermes after that decision.
  allow_unattended_tools: true

# Define your agent profiles here (must already exist in Hermes)
# Stable role IDs map phase work to existing Hermes profile names.
# NOTE: model/provider live in each profile's own config.yaml, not here.
#       The Profiles page reads them from the active Hermes profile root.
#       Set RESEARCH_HUB_HERMES_ROOT to override Hermes' platform default.
agents:
- id: "research_lead"
  profile: "research_lead"
  name: "Research Lead"
  role: "scientific question, framing, synthesis"

- id: "theorist"
  profile: "theorist"
  name: "Theorist"
  role: "statistical theory, assumptions, proofs"

- id: "data_scientist"
  profile: "data_scientist"
  name: "Data Analyst"
  role: "implementation, numerical studies, data analysis"

- id: "paper_reviewer"
  profile: "paper_reviewer"
  name: "Paper Reviewer"
  role: "independent scientific assessment"

# ---------------------------------------------------------------------------
# Phase definitions
#
# The user explicitly starts every run. The research_lead then executes only
# that run's configured plan, submits a summary for review, and stops. Neither
# completion nor approval starts another phase.
#
# Fields:
#   slug: phase identifier (NN-name), used everywhere
#   name: display name
#   description: one-line summary
#   pattern: exact interaction structure for the run
#     parallel: members investigate independently, then the lead synthesizes
#     sequential: fixed ordered handoffs, with each stage reading the prior one
#     debate: independent proposals followed by configured comparison rounds
#   gated_by: launch prerequisites. Most phases allow a recorded user override;
#     a strict phase may require intact completed results instead.
#   context_from: additional phases whose intact completed results may be frozen
#     as context. Method-bound runs filter them to the selected stable method ID
#     and label results from older definitions as history.
#   folder: where this phase's run outputs are written, relative to the project
#   members: roles that may participate in the configured plan
#   rounds: allowed/default depth for parallel and debate work
#   stages: exact ordered handoffs for sequential work
#   available_run_plans: explicit Web UI plans for a phase with supported
#     user-selected variants
#
# There is no "modes" field. User direction may change the research focus, but
# it cannot add, skip, reorder, or automatically start configured phases.
# ---------------------------------------------------------------------------
phases:
- slug: "01-literature-review"
  name: "Literature Review"
  short_name: "Lit Review"
  description: "Assess direct prior work, theoretical foundations, related methods,
    existing implementations, and originality"
  pattern: parallel
  gated_by: []
  folder: "references/literature-review/"
  members: [research_lead, theorist, data_scientist]
  rounds: {min: 1, default: 2, max: 5}
- slug: "02-method-development"
  name: "Method Development"
  short_name: "New Method"
  description: "Brainstorm genuinely new ideas, including new mechanisms, frameworks, or insights
    with a unique position distinct from any existing method"
  pattern: parallel
  gated_by: ["01-literature-review"]
  folder: "ideas/"
  members: [theorist, research_lead, data_scientist]
  rounds: {min: 2, default: 2, max: 3}
- slug: "03-idea-evaluation"
  name: "Theoretical Development"
  short_name: "Theory & Proofs"
  description: "Derive and prove the main theorems and rate bounds for the selected
    method, with computational cost assessment and cross-audit"
  pattern: sequential
  method_binding: true
  gated_by: ["02-method-development"]
  context_from: ["04-draft-assembly"]
  folder: "evaluations/"
  members:
  - theorist
  - data_scientist
  - research_lead
  rounds:
    min: 3
    default: 3
    max: 3
  stages:
  - name: Develop the theory
    role: theorist
    description: Derive the mathematical results, assumptions, proofs, bounds,
      limitations, and unresolved conjectures for the selected method.
  - name: Audit the theory and assess computation
    role: data_scientist
    description: Read the theorist's report, test its assumptions and proof steps,
      and quantify implementation feasibility, numerical stability, and cost.
  - name: Synthesize the theoretical record
    role: research_lead
    description: Read both specialist reports, resolve what can be resolved, and
      summarize proved claims, open gaps, disagreements, and empirical implications.
- slug: "04-draft-assembly"
  name: "Implementation & Experiments"
  short_name: "Code & Experiments"
  description: "Implement the method in code, run pre-specified experiments with
    diagnostics, and validate theoretical predictions against measured results"
  pattern: sequential
  method_binding: true
  protocol_checkpoint: true
  run_modes:
    plans: ["preliminary", "comprehensive"]
    default: "preliminary"
  gated_by: ["02-method-development"]
  context_from: ["03-idea-evaluation"]
  folder: "draft/sections/"
  members:
  - data_scientist
  - theorist
  - research_lead
  rounds:
    min: 3
    default: 3
    max: 3
  stages:
  - name: Implement and evaluate
    role: data_scientist
    description: Prespecify the study, implement the selected method, and run the
      diagnostics or experiments required by the user-selected scope.
  - name: Audit the implementation and evidence
    role: theorist
    description: Read the analyst's report, check fidelity to the method definition,
      and assess empirical findings against any available same-branch theory.
  - name: Synthesize the computational record
    role: research_lead
    description: Read both specialist reports and summarize implementation status,
      empirical support, discrepancies, unresolved disagreements, and next steps.
- slug: "05-review-revision"
  name: "Paper Assembly & Review"
  short_name: "Paper Draft"
  description: "Assemble the paper from theory and experiments, then independent
    paper review and revision into final manuscript"
  pattern: sequential
  method_binding: true
  gated_by: ["03-idea-evaluation", "04-draft-assembly"]
  folder: "draft/revised/"
  members:
  - paper_reviewer
  - research_lead
  run_modes:
    plans: ["assembly", "review_revision"]
    default: "assembly"
  stages:
  - name: Assemble
    role: research_lead
    description: Combine theory, experiments, and literature into a coherent
      manuscript with unified notation and consistent claims.

